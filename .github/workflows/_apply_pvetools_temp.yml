name: apply-pvetools-temp
on:
  push:
    paths:
      - '.github/_update_pvetools_temp.py'
      - '.github/workflows/_apply_pvetools_temp.yml'
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply update
        run: python3 .github/_update_pvetools_temp.py
      - name: Commit and cleanup
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          rm -f .github/_update_pvetools_temp.py .github/workflows/_apply_pvetools_temp.yml
          git add src/pve/disk_monitor.sh .github/_update_pvetools_temp.py .github/workflows/_apply_pvetools_temp.yml
          git diff --cached --quiet && exit 0 || true
          git commit -m 'feat: align temperature display with PVE Tools Pro'
          git push
