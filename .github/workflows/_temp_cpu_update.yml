name: Apply CPU temperature UI update

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  update-cpu-temperature:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - name: Update CPU temperature renderer
        run: python3 .github/_update_cpu_temperature.py
      - name: Commit CPU temperature UI update and remove temporary files
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/pve/disk_monitor.sh
          rm -f .github/workflows/_temp_cpu_update.yml .github/_update_cpu_temperature.py
          git add -u .github/workflows/_temp_cpu_update.yml .github/_update_cpu_temperature.py
          git diff --cached --quiet && exit 0
          git commit -m 'Update CPU temperature display and thresholds'
          git push
