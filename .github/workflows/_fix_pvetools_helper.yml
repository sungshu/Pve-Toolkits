name: fix-pvetools-helper
on:
  push:
    paths:
      - '.github/workflows/_fix_pvetools_helper.yml'
permissions:
  contents: write
jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Fix helper replacement callback
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('.github/_update_pvetools_temp.py')
          s = p.read_text(encoding='utf-8')
          s = s.replace('s2, n = re.subn(pat, cpu, s, count=1, flags=re.M|re.S)', 's2, n = re.subn(pat, lambda m: cpu, s, count=1, flags=re.M|re.S)')
          p.write_text(s, encoding='utf-8')
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          rm -f .github/workflows/_fix_pvetools_helper.yml
          git add .github/_update_pvetools_temp.py .github/workflows/_fix_pvetools_helper.yml
          git commit -m 'fix: update temperature helper replacement'
          git push
